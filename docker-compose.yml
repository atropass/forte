# Production stack (any Docker host):
#   frontend (nginx :8080, the only public port: static UI + /api proxy)
#   api, worker (backend image, sharing the `data` volume for videos/results)  +  Redis (AOF)
# The GPU models run on separate GPU servers (VLM_API_BASE / DET_API_BASE in .env).
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose run --rm init admin create-api-key --name jury
#   docker compose run --rm init admin create-user jury
#
# TLS: put a reverse proxy in front of :8080, or `docker compose --profile tls up -d` (Caddy, needs DOMAIN).
# Existing Redis: remove the redis service and set REDIS_URL. Object storage instead of the volume (several hosts,
# Ceph / AWS / MinIO ...): set STORAGE_BACKEND=s3 and S3_* in .env (they override the defaults below).
x-backend: &backend
  image: ${REGISTRY:-forte}/forte-backend:${IMAGE_TAG:-latest}
  build: { context: ., dockerfile: docker/backend.Dockerfile }
  env_file: .env
  environment: &backend-env
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
    DATA_DIR: /data
    TMPDIR: /tmp
    FRONTEND_DIR: /nonexistent
  user: "10001:10001"
  read_only: true
  volumes: [data:/data]
  tmpfs:
    - /tmp:size=2g,mode=1777
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  init:
    <<: *backend
    command: ["admin", "init-storage"]
    restart: "no"
    depends_on:
      redis: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    expose: ["8000"]
    depends_on:
      init: { condition: service_completed_successfully }
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      init: { condition: service_completed_successfully }
    stop_grace_period: 330s   # running jobs finish before the container stops
    healthcheck:
      test: ["CMD", "python", "-m", "service.worker_main", "check"]
      interval: 30s
      timeout: 10s
      start_period: 60s

  frontend:
    image: ${REGISTRY:-forte}/forte-frontend:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["${PUBLIC_BIND:-0.0.0.0}:${PUBLIC_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "frontend:8080"]
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [frontend]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory-policy", "noeviction", "--save", "300", "10"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  redis-data:
  caddy-data:
