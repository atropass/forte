# Production reference stack (any Docker host; maps 1:1 to Kubernetes, see deploy/k8s):
#   api ×1 (WEB_CONCURRENCY processes)  +  worker (WORKER_COUNT processes)  +  Redis (AOF)  +  MinIO (S3 API)
# The GPU models run on separate GPU servers (VLM_API_BASE / DET_API_BASE in .env).
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose run --rm init admin create-api-key --name jury
#   docker compose run --rm init admin create-user jury
#
# To use an existing Redis / S3 (Ceph, AWS, ...), remove the redis/minio services and set REDIS_URL / S3_* in .env.
x-service: &service
  image: forte-vision:${IMAGE_TAG:-latest}
  build: { context: ., dockerfile: docker/service.Dockerfile }
  env_file: .env
  environment: &service-env
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: ${S3_BUCKET:-forte-vision}
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    TMPDIR: /tmp
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=2g,mode=1777
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  init:
    <<: *service
    command: ["admin", "init-storage"]
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *service
    command: ["api"]
    ports: ["${PUBLIC_PORT:-8000}:8000"]
    depends_on:
      init: { condition: service_completed_successfully }
    stop_grace_period: 30s

  worker:
    <<: *service
    command: ["worker"]
    depends_on:
      init: { condition: service_completed_successfully }
    stop_grace_period: 330s   # running jobs finish before the container stops
    healthcheck:
      test: ["CMD", "python", "-m", "service.worker_main", "check"]
      interval: 30s
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory-policy", "noeviction", "--save", "300", "10"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
