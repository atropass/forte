# Ingress only to the API from the ingress controller namespace; egress limited to DNS + HTTPS/Redis.
# Tighten the egress CIDRs to the bank's Redis, S3 and GPU-server addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forte-vision
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [forte-api, forte-worker] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8000, protocol: TCP }]
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 9000, protocol: TCP }
