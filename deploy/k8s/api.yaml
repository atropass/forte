apiVersion: apps/v1
kind: Deployment
metadata:
  name: forte-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: forte-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: forte-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: forte-vision
          args: ["api"]
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ secretRef: { name: forte-vision } }]
          env:
            - { name: TMPDIR, value: /tmp }
            - { name: WEB_CONCURRENCY, value: "2" }
            - { name: REAPER_IN_API, value: "1" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: forte-api
spec:
  selector: { app: forte-api }
  ports: [{ port: 80, targetPort: http, name: http }]
