# Reference manifests: API + workers. Redis and S3 are provided by the platform (REDIS_URL / S3_* in the secret).
#   kubectl -n forte-vision create secret generic forte-vision --from-env-file=prod.env
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forte-vision
labels:
  - pairs:
      app.kubernetes.io/part-of: forte-vision
    includeSelectors: false
resources:
  - api.yaml
  - worker.yaml
  - networkpolicy.yaml
images:
  - name: forte-vision
    newName: registry.example.kz/forte-vision
    newTag: latest
