# Legal basis, keyed by violation code from the team catalog (legal/violations_catalog.source.json).
# Every clause below was checked against the act text (zakon.uchet.kz mirror of adilet; see research_notes.md).
# verified: true  = clause text read and it matches the requirement as paraphrased
# verified: false = document is right but applying the clause to the observed behaviour is an interpretation
# Corrections vs the team catalog are listed in legal/catalog_verification.md.
documents:
  nbrk_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
      второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и
      юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    issuer: Правление Национального Банка Республики Казахстан
    act: постановление от 29 ноября 2019 года № 231 (рег. № 19680)
    url: https://adilet.zan.kz/rus/docs/V1900019680
  nbrk_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
      Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью
      которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность
      исключительно через обменные пункты
    issuer: Правление Национального Банка Республики Казахстан
    act: постановление от 24 февраля 2020 года № 14 (рег. № 20075)
    url: https://adilet.zan.kz/rus/docs/V2000020075

refs:
  V01:
    doc: nbrk_231
    clause: п. 12
    requirement: >-
      Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла;
      допускается внос лекарственных средств, медицинских изделий и средств связи без функции фото- и видеофиксации.
    verified: true
  V02:
    doc: nbrk_231
    clause: п. 22
    requirement: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
    verified: true
  V03:
    doc: nbrk_231
    clause: п. 20 (абзац второй)
    requirement: >-
      На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги
      хранятся в специальных устройствах, закрывающихся на ключ (металлический шкаф, сейф, тележка, ящики стола, тумба).
    verified: true
  V03_keys:
    doc: nbrk_231
    clause: п. 80; п. 20 (абзац второй)
    requirement: >-
      Порядок хранения ключей от специальных устройств для хранения наличных денег на рабочем месте кассира
      (металлический шкаф, сейф, тележка, ящики стола) определяется внутренними документами банка, обеспечивающими
      исключение их несанкционированного использования (п. 80); ранее принятые деньги хранятся в устройствах,
      закрывающихся на ключ (п. 20).
    interpretation: Ключ, оставленный в замке сейфа без присмотра, допускает несанкционированное использование.
    verified: false
  V03_bag:
    doc: nbrk_231
    clause: п. 20 (абзац второй); п. 14
    requirement: >-
      Ранее принятые наличные деньги хранятся в устройствах, закрывающихся на ключ (п. 20); банк исключает
      условия для хищения наличных денег и ценностей (п. 14).
    interpretation: Инкассаторская сумка с ценностями, оставленная на столе без присмотра, не помещена в хранилище.
    verified: false
  V05:
    doc: nbrk_231
    clause: п. 19, пп. 1) (приём); п. 31, пп. 1) (выдача)
    requirement: >-
      Кассовый работник проводит визуальную идентификацию клиента по документу, удостоверяющему личность,
      либо по данным сервиса цифровых документов.
    verified: true
  V06:
    doc: nbrk_231
    clause: п. 19, пп. 2); п. 57; п. 9
    requirement: >-
      Банкноты принимаются с полистным пересчётом и проверкой на подлинность и платёжность (пп. 2 п. 19, п. 57);
      банк обеспечивает наличие оборудования для проверки подлинности (п. 9).
    verified: true
  V13:
    doc: nbrk_231
    clause: п. 24
    requirement: >-
      Наличные деньги от подразделения инкассации принимаются кассовым работником на основании препроводительного
      документа: проверка сведений документа, регистрация суммы, проверка целостности сумки и правильности пломбирования.
    interpretation: >-
      Прямого требования «инкассатор предъявляет удостоверение кассиру» в п. 24 нет; нарушение — приём сумки без
      видимой проверки сопроводительного документа.
    verified: false
  V16:
    doc: nbrk_14
    clause: п. 8; п. 16, пп. 1)
    requirement: >-
      Кассовый узел изолируется от других помещений одним закрывающимся служебным входом (п. 8); каждая касса
      имеет отдельный вход с дверью, закрывающейся на замок (пп. 1 п. 16).
    interpretation: >-
      Одновременный допуск второго посетителя во время операции нарушает изолированный режим помещения.
      (Также п. 14 Правил № 231 — исключение условий для хищения.)
    verified: false
  V17:
    doc: nbrk_14
    clause: п. 8; п. 16, пп. 1)
    requirement: >-
      Кассовый узел изолируется одним закрывающимся служебным входом (п. 8); каждая касса имеет отдельный вход
      с дверью, закрывающейся на замок (пп. 1 п. 16).
    interpretation: Дверь, оставленная открытой во время работы с ценностями, лишает помещение изоляции.
    verified: true
  V19:
    doc: nbrk_231
    clause: пп. 59–61
    requirement: >-
      Сомнительные банкноты принимаются на экспертизу по акту в присутствии клиента и заведующего кассой;
      банкноты с признаками подделки клиенту не возвращаются.
    verified: true
  X01:
    doc: nbrk_231
    clause: п. 14 (общее требование)
    requirement: >-
      Банк обеспечивает осуществление кассовых операций так, чтобы исключались условия для хищения наличных
      денег и ценностей и других противоправных действий.
    interpretation: >-
      Незаблокированный компьютер кассира без присмотра открывает доступ к банковским системам. Специальной
      нормы НБРК о блокировке экрана не найдено.
    verified: false
  X02:
    doc: nbrk_231
    clause: п. 20 (абзац второй); п. 14
    requirement: >-
      На рабочем месте кассового работника находятся только наличные деньги клиента, ранее принятые хранятся
      под ключ (п. 20); исключение условий для хищения (п. 14).
    interpretation: >-
      Приём клиента до того, как кассир занял рабочее место и подготовил его, лишает операцию контроля.
      Точной нормы не найдено.
    verified: false
