# Legal basis per rule reference id. Only Republic of Kazakhstan acts (NBRK, adilet.zan.kz).
# verified: true  = clause text was read in the act (via the zakon.uchet.kz mirror of adilet, see research_notes.md)
# verified: false = document is right but the clause, or the clause's applicability, is an interpretation
# interpretation: explains how the observed behaviour relates to the clause (no stronger legal claim is made).
documents:
  nbrk_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
      второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и
      юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    issuer: Правление Национального Банка Республики Казахстан
    act: постановление от 29 ноября 2019 года № 231
    url: https://adilet.zan.kz/rus/docs/V1900019680
  nbrk_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
      Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью
      которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность
      исключительно через обменные пункты
    issuer: Правление Национального Банка Республики Казахстан
    act: постановление от 24 февраля 2020 года № 14 (зарегистрировано в МЮ РК 27.02.2020 № 20075)
    url: https://adilet.zan.kz/rus/docs/V2000020075

refs:
  client_id:
    doc: nbrk_231
    clause: п. 19, пп. 1)
    requirement: >-
      При приёме наличных денег кассовый работник проводит визуальную идентификацию клиента по документу,
      удостоверяющему личность (либо по данным сервиса цифровых документов).
    verified: true
  collector_docs:
    doc: nbrk_231
    clause: п. 24; п. 101
    requirement: >-
      Наличные деньги от подразделения инкассации принимаются кассовым работником на основании
      препроводительного документа с проверкой целостности и пломбирования сумки (п. 24); инкассатор
      выезжает с доверенностью и иными документами, выдаваемыми перед выездом (п. 101).
    interpretation: >-
      Прямой формулировки «инкассатор предъявляет удостоверение кассиру» в п. 24 нет; нарушение трактуется как
      приём сумки без предъявления/проверки сопроводительных документов инкассатора.
    verified: false
  personal_items:
    doc: nbrk_231
    clause: п. 12
    requirement: >-
      Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла
      (допускаются лекарства, медизделия и средства связи без функции фото- и видеофиксации).
    verified: true
  safekeeping_general:
    doc: nbrk_231
    clause: п. 14 (общее требование)
    requirement: >-
      Банк обеспечивает осуществление кассовых операций так, чтобы исключались условия для хищения наличных
      денег и ценностей.
    interpretation: >-
      Оставление денег, открытого сейфа, ключа в замке сейфа или незаблокированного компьютера без присмотра
      трактуется как создание условий для хищения. Специальной нормы РК о ключах сейфа и блокировке экрана не найдено.
    verified: false
  cit_bag:
    doc: nbrk_231
    clause: п. 14 (общее требование); п. 93
    requirement: >-
      Сумки для инкассации обеспечивают сохранность ценностей (п. 93); банк исключает условия для хищения
      наличных денег и ценностей (п. 14).
    interpretation: Инкассаторская сумка, оставленная на столе без присмотра, — условие для хищения.
    verified: false
  cash_room_door:
    doc: nbrk_14
    clause: п. 16, пп. 1); п. 19, пп. 1)
    requirement: >-
      Каждая касса (и помещение для пересчёта наличных денег) имеет отдельный вход с дверью, закрывающейся на замок.
    interpretation: Дверь, оставленная открытой во время работы с ценностями, лишает помещение предусмотренной изоляции.
    verified: true
  cash_room_access:
    doc: nbrk_231
    clause: п. 14 (общее требование)
    requirement: >-
      Банк обеспечивает осуществление кассовых операций так, чтобы исключались условия для хищения наличных
      денег и ценностей.
    interpretation: >-
      Допуск второго посетителя во время операции и начало обслуживания до готовности рабочего места
      трактуются как нарушение контролируемого режима кассового помещения. Точной нормы не найдено.
    verified: false
  banknote_check:
    doc: nbrk_231
    clause: п. 19, пп. 2); п. 57; пп. 59–60
    requirement: >-
      Банкноты принимаются с полистным пересчётом и проверкой подлинности и платёжности; с сомнительными
      банкнотами работают в порядке, установленном пп. 59–60.
    verified: true
