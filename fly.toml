# Fly.io: one machine (Redis + API/UI + workers, docker/fly-start.sh) on the `forte_data` volume.
# Secrets (not in this file): API_KEY (jury key), VLM_API_BASE, VLM_API_KEY, DET_API_BASE, DET_API_KEY  ->  fly secrets set ... -a forte-vision
# Deploy: every push to main (CI, .github/workflows/ci.yml), or by hand: fly deploy --remote-only
app = "forte-vision"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 300   # let running analyses finish on deploys / restarts

[build]
  dockerfile = "docker/fly.Dockerfile"

[env]
  PUBLIC_ORIGIN = "https://forte-vision.fly.dev"
  # 1 GB machine: one API process, two parallel analyses (the GPU work runs on the pods)
  WEB_CONCURRENCY = "1"
  WORKER_COUNT = "2"
  VLM_CONCURRENCY = "16"
  JOB_TIMEOUT_S = "290"
  # GPU pod addresses and tokens are secrets: VLM_API_BASE / VLM_API_KEY, DET_API_BASE / DET_API_KEY (CV pod)

[[mounts]]
  source = "forte_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # the queue and workers live on this machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
