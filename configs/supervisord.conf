[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:vllm]
command=/workspace/venv/bin/python -m vllm.entrypoints.openai.api_server --model Qwen/Qwen3-VL-4B-Instruct --host 127.0.0.1 --port 8002 --max-model-len 8192 --gpu-memory-utilization 0.85 --max-num-seqs 32 --enable-chunked-prefill --enable-prefix-caching
directory=/workspace
; VLLM_API_KEY is inherited from the environment (scripts/setup_gpu_prod.sh sources /workspace/secrets.env);
; vLLM reads it natively, so the key never appears on a command line (ps).
environment=VLLM_NO_USAGE_STATS="1",DO_NOT_TRACK="1",HF_HOME="/workspace/hf_home",VLLM_CACHE_ROOT="/workspace/.cache/vllm",TORCH_EXTENSIONS_DIR="/workspace/.cache/torch_extensions"
autostart=true
autorestart=true
startsecs=15
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/vllm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/workspace/logs/vllm_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;' -c /workspace/forte/configs/nginx.vllm.conf
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/workspace/logs/nginx.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/nginx_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:cv_service]
command=/workspace/venv/bin/python -m uvicorn service.cv_service:app --host 127.0.0.1 --port 8005 --workers 1 --no-server-header
directory=/workspace/forte
; CV_API_KEY is inherited from the environment (see above)
environment=PYTHONPATH="/workspace/forte"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/cv_service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/cv_service_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:watchdog_vllm]
command=/workspace/forte/scripts/pod_watchdog.sh /workspace/forte/configs/supervisord.conf vllm http://127.0.0.1:8002/health 900
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/watchdog.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
