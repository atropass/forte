[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:cv_service]
command=/workspace/venv/bin/python -m uvicorn service.cv_service:app --host 127.0.0.1 --port 8005 --workers 1 --no-server-header
directory=/workspace/forte
; CV_API_KEY is inherited from the environment: scripts/start_cv.sh sources /workspace/secrets.env (chmod 600)
; weights in /workspace/hf_home (persistent volume, downloaded once at setup); never reach the hub at runtime
environment=PYTHONPATH="/workspace/forte",HF_HOME="/workspace/hf_home",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/cv_service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/cv_service_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;' -c /workspace/forte/configs/nginx.cv.conf
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/workspace/logs/nginx.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/nginx_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:watchdog_cv]
command=/workspace/forte/scripts/pod_watchdog.sh /workspace/forte/configs/supervisord.cv.conf cv_service http://127.0.0.1:8005/health 600
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/watchdog.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
