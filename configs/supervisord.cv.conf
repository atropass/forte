[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:cv_service]
command=/workspace/venv/bin/python -m uvicorn service.cv_service:app --host 127.0.0.1 --port 8005 --workers 1
directory=/workspace/forte
environment=PYTHONPATH="/workspace/forte",CV_API_KEY="fv-prod-secret-forte-2026"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/cv_service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/cv_service_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;' -c /workspace/forte/configs/nginx.cv.conf
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/workspace/logs/nginx.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/nginx_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
