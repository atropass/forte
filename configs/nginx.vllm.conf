# Gateway in front of vLLM on the GPU pod (port 8000 -> vLLM 127.0.0.1:8002, CV service 127.0.0.1:8005 under /cv/).
# Server-to-server only: no CORS. vLLM enforces Bearer VLLM_API_KEY, the CV service Bearer CV_API_KEY.
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /workspace/logs/nginx_access.log;
    error_log /workspace/logs/nginx_error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;

    limit_req_zone $binary_remote_addr zone=vllm_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream vllm_backend {
        server 127.0.0.1:8002;
        keepalive 64;
    }

    upstream cv_backend {
        server 127.0.0.1:8005;
        keepalive 16;
    }

    server {
        listen 8000;
        server_name _;

        # a chat request carries a few base64 JPEG frames; 20 MB is far above any legitimate call
        client_max_body_size 20M;

        location /cv/ {
            limit_except GET POST { deny all; }
            proxy_pass http://cv_backend/cv/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://vllm_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Prometheus metrics: only from the pod itself (vLLM's --api-key does not cover /metrics)
        location = /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://vllm_backend/metrics;
            proxy_http_version 1.1;
        }

        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }

        location / {
            limit_req zone=vllm_limit burst=50 nodelay;
            limit_except GET POST { deny all; }

            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Connection "";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
