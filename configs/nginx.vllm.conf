pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /workspace/logs/nginx_access.log;
    error_log /workspace/logs/nginx_error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;

    # Rate limiting zone: 30 requests/second per IP with burst allowance
    limit_req_zone $binary_remote_addr zone=vllm_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream vllm_backend {
        server 127.0.0.1:8001;
        keepalive 64;
    }

    server {
        listen 8000;
        server_name _;

        client_max_body_size 600M;

        # Health probe (bypass rate limits)
        location /health {
            proxy_pass http://vllm_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics for Prometheus
        location /metrics {
            proxy_pass http://vllm_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # vLLM API (OpenAI Compatible)
        location / {
            limit_req zone=vllm_limit burst=50 nodelay;

            # Direct streaming configuration (prevents buffer stalls & timeouts)
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Connection "";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS support for web clients (e.g., localhost:3000 / Next.js)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
        }
    }
}
