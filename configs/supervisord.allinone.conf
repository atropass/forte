; Single-host mode (docker/service.Dockerfile, role "allinone"): Redis + API + workers in one container.
; State (Redis AOF, stored files) lives on the /data volume. For multi-host deployments run the roles separately
; (docker-compose.prod.yml).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir %(ENV_DATA_DIR)s/redis --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --protected-mode yes
priority=10
autorestart=true
startsecs=2
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=python -m uvicorn service.app:app --host 0.0.0.0 --port %(ENV_PORT)s --workers %(ENV_WEB_CONCURRENCY)s --timeout-keep-alive 75 --proxy-headers --forwarded-allow-ips * --no-server-header
priority=20
autorestart=true
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=python -m service.worker_main
priority=30
autorestart=true
startsecs=5
; let running jobs finish (JOB_TIMEOUT_S + margin) on shutdown
stopwaitsecs=330
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
