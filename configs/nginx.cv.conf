# Gateway in front of the CV service on the GPU pod (port 8000 -> uvicorn 127.0.0.1:8005).
# Server-to-server only: no CORS. Auth (Bearer CV_API_KEY) is enforced by the service itself.
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /workspace/logs/nginx_access.log;
    error_log /workspace/logs/nginx_error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;

    limit_req_zone $binary_remote_addr zone=cv_limit:10m rate=60r/s;
    limit_req_status 429;

    upstream cv_backend {
        server 127.0.0.1:8005;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;

        # one JPEG frame per request (~0.1-1 MB); anything larger is not a legitimate call
        client_max_body_size 20M;

        location = /health {
            proxy_pass http://cv_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # interactive docs are not exposed publicly
        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }

        location / {
            limit_req zone=cv_limit burst=100 nodelay;
            limit_except GET POST { deny all; }

            proxy_pass http://cv_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
