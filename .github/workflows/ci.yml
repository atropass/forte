# CI: tests on every push and pull request. CD: every push to main that passes the tests is deployed to
# Fly.io (forte-vision.fly.dev, see fly.toml). The checkout is clean, so .env / videos never reach the image.
# Needs the repo secret FLY_API_TOKEN (flyctl tokens create deploy -a forte-vision).
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-service.txt
      - run: pip install -r requirements-service.txt pytest
      - run: python -m pytest -q tests

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: fly-deploy   # one deploy at a time; a newer push waits for the running one
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
