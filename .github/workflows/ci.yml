# CI on every push and pull request: tests, UI typecheck/build, secret scan, and both Docker images built and
# smoke-tested together (frontend nginx -> api -> Redis). On main the images are pushed to GHCR:
#   ghcr.io/<owner>/forte-backend:{sha-<short>,latest}, ghcr.io/<owner>/forte-frontend:{sha-<short>,latest}
# Third-party actions are pinned to commit SHAs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forte-vision-ai-development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: forte-vision-ai-development/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: gitleaks (working tree)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  images:
    needs: [test, ui, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: build backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: docker/backend.Dockerfile
          tags: ${{ env.REGISTRY }}/forte-backend:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: build frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: docker/frontend.Dockerfile
          tags: ${{ env.REGISTRY }}/forte-frontend:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: smoke test (frontend -> api -> redis, no GPU)
        run: |
          cp .env.example .env
          sed -i -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-pass/' \
                 -e 's/^COOKIE_SECURE=.*/COOKIE_SECURE=0/' -e 's|^PUBLIC_ORIGIN=.*|PUBLIC_ORIGIN=http://localhost:8080|' .env
          docker compose up -d --no-build --wait --wait-timeout 180 frontend
          KEY=$(docker compose run --rm -T init admin create-api-key --name ci-smoke | tail -1); test -n "$KEY"
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=848x464:rate=25:duration=3 -c:v libx264 -pix_fmt yuv420p /tmp/x.mov
          set -x
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          curl -sf http://localhost:8080/healthz
          curl -s http://localhost:8080/readyz | grep -q '"redis":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@/tmp/x.mov http://localhost:8080/api/v1/analyze)" = 401
          curl -sf -H "X-API-Key: $KEY" -F file=@/tmp/x.mov http://localhost:8080/api/v1/analyze | grep -q job_id
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $KEY" -F file=@.env.example http://localhost:8080/api/v1/analyze)" = 415
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in forte-backend forte-frontend; do
            docker tag "$REGISTRY/$img:$IMAGE_TAG" "$REGISTRY/$img:latest"
            docker push "$REGISTRY/$img:$IMAGE_TAG"
            docker push "$REGISTRY/$img:latest"
          done
