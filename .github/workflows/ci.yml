# CI: tests, UI typecheck/build and a secret scan on every push and pull request.
# CD: every push to main that passes is deployed to Fly.io (fly.toml), unless the repository variable
# DEPLOY_FREEZE is "true" (set it for the jury evaluation window). Needs the secret FLY_API_TOKEN
# (flyctl tokens create deploy -a forte-vision). Third-party actions are pinned to commit SHAs.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forte-vision-ai-development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: forte-vision-ai-development/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: gitleaks (working tree)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  deploy:
    needs: [test, ui, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: fly-deploy   # one deploy at a time; a newer push waits for the running one
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master @ pin date
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: smoke test
        run: |
          for i in $(seq 1 30); do
            curl -sf https://forte-vision.fly.dev/healthz && exit 0
            sleep 10
          done
          exit 1
