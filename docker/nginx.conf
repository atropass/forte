# Frontend nginx (nginx-unprivileged, port 8080): static UI + reverse proxy to the backend `api` service.
# Security headers for /api responses come from the backend; static responses get the same set here.

# client address: trust X-Forwarded-For only from private networks (a TLS proxy / load balancer in front)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# keep the X-Forwarded-Proto of a TLS proxy in front, otherwise use our own scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's embedded DNS: re-resolve `api` so a restarted backend container is found
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    client_max_body_size 101m;      # MAX_UPLOAD_MB=100 (+ multipart overhead); the backend enforces it too
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Fly-Client-IP "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /api/v1/analyze {
        proxy_request_buffering off;   # stream uploads to the backend
        proxy_pass $api_upstream;
    }
    location /api/ {
        proxy_pass $api_upstream;
    }
    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz  { proxy_pass $api_upstream; }
    location = /metrics { return 404; }   # scrape the api service directly on the internal network

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
