# One entry per violation type. The rule engine (rules.py) evaluates `trigger` events from the timeline,
# runs the listed VLM `checks` on frames at the given offsets (seconds relative to the trigger), and
# fires when at least `min_yes` of the frames answer "yes" (2-of-3 voting = two-signal confirmation).
# timecode = trigger time + timecode_offset. Descriptions are Russian templates; {t} = timecode.

types:
  key_left_in_safe:
    title: Ключ оставлен в замке сейфа
    trigger: cashier_left
    checks: [{q: key_in_safe, offsets: [2.5, 3.5, 4.5], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с кассир покидает рабочее место; в замке дверцы сейфа виден оставленный ключ."
    reason: "Оставление ключа в сейфе без присмотра создаёт условия для хищения ценностей."
    legal: safekeeping_general
    untested_note: Ключ в замке занимает ~3 пикселя на исходном разрешении; проверка опирается на VLM и может давать пропуски.
  safe_left_open:
    title: Сейф оставлен открытым
    trigger: [cashier_left, periodic]
    checks: [{q: safe_open, offsets: [2.5, 3.5, 4.5], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с дверца сейфа открыта, при этом кассир находится не у сейфа."
    reason: "Открытый сейф без непосредственного контроля кассира создаёт условия для хищения ценностей."
    legal: safekeeping_general
  money_left_unattended:
    title: Деньги оставлены на столе без присмотра
    trigger: cashier_left
    checks: [{q: money_on_desk, offsets: [2.5, 3.5, 4.5], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с кассир покидает рабочее место; на столе остаются наличные деньги."
    reason: "Наличные деньги оставлены без присмотра ответственного лица."
    legal: safekeeping_general
  bag_left_on_desk:
    title: Инкассаторская сумка оставлена на столе
    trigger: cashier_left
    checks: [{q: bag_on_desk, offsets: [2.5, 3.5, 4.5], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с кассир покидает рабочее место; на столе остаётся инкассаторская сумка (мешок)."
    reason: "Сумка для инкассации оставлена без присмотра."
    legal: cit_bag
  laptop_unlocked_unattended:
    title: Компьютер не заблокирован при уходе кассира
    trigger: cashier_left
    checks: [{q: laptop_on, offsets: [2.5, 3.5, 4.5], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с кассир покидает рабочее место; на экране ноутбука открыто рабочее приложение (экран не заблокирован)."
    reason: "Незаблокированное рабочее место позволяет постороннему доступ к банковским системам."
    legal: safekeeping_general
  left_without_safe_key:
    title: Кассир ушёл, не забрав ключ от сейфа (не тестировано)
    trigger: cashier_left
    checks: []   # covered by key_in_safe; kept as a separate type for keys left elsewhere (not in training data)
    enabled: false
    legal: safekeeping_general
  prev_client_money_on_desk:
    title: Деньги предыдущего клиента на столе при подходе следующего
    trigger: visitor_arrived_after_visitor
    checks: [{q: money_on_desk, offsets: [0.0, 1.0, 2.0], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с к столу подходит следующий посетитель, при этом на столе лежат наличные деньги от предыдущей операции."
    reason: "Наличные деньги предыдущего клиента не убраны до начала обслуживания следующего."
    legal: safekeeping_general
  second_client_during_service:
    title: Второй посетитель во время обслуживания клиента
    trigger: second_visitor
    checks: []   # detector-only, confirmed by sustained occupancy
    timecode_offset: 0
    observed: "На {t} с в кассовое помещение входит второй посетитель, пока обслуживается первый клиент."
    reason: "Одновременное присутствие посторонних лиц при совершении кассовой операции нарушает режим кассового помещения."
    legal: cash_room_access
  client_admitted_workplace_not_ready:
    title: Клиент допущен до готовности рабочего места
    trigger: visitor_arrived
    checks: [{q: cashier_ready, offsets: [0.0, 1.0, 2.0], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с в помещение входит клиент, когда кассир ещё не готов к обслуживанию (стоит/настраивает оборудование)."
    reason: "Обслуживание клиента начато до подготовки рабочего места кассира."
    legal: cash_room_access
  door_left_open:
    title: Дверь кассового помещения оставлена открытой
    trigger: cashier_entered
    checks: [{q: door_open, offsets: [2.0, 3.0, 4.0], min_yes: 2}]
    timecode_offset: 1.0
    observed: "На {t} с кассир входит в помещение; дверь кассового помещения остаётся открытой."
    reason: "Кассовое помещение должно быть изолировано дверью, закрывающейся на замок."
    legal: cash_room_door
  client_no_id:
    title: Приём наличных без предъявления документа клиентом
    trigger: visitor_episode
    checks: [{q: handover_first_item, expect: banknotes}]
    timecode_offset: 0
    observed: "На {t} с клиент передаёт кассиру наличные деньги; документ, удостоверяющий личность, перед этим не предъявлялся."
    reason: "При приёме наличных кассир обязан провести визуальную идентификацию клиента по документу, удостоверяющему личность."
    legal: client_id
  collector_no_id:
    title: Инкассаторская сумка принята без предъявления документов инкассатором
    trigger: visitor_episode
    checks: [{q: handover_first_item, expect: bag}]
    timecode_offset: 0
    observed: "На {t} с посетитель передаёт кассиру инкассаторскую сумку; документы (удостоверение/доверенность) перед этим не предъявлялись."
    reason: "Приём ценностей от инкассатора без проверки его документов."
    legal: collector_docs
  personal_items_on_desk:
    title: Личные вещи на рабочем месте кассира
    trigger: periodic
    checks: [{q: personal_items, offsets: [0.0, 1.0, 2.0], min_yes: 2}]
    timecode_offset: 0
    observed: "На {t} с на рабочем столе кассира находятся личные вещи (сумка/одежда/еда/напитки)."
    reason: "Личные вещи работников хранятся вне кассового узла."
    legal: personal_items
  unsecured_valuables_generic:
    title: Ценности/рабочее место оставлены без присмотра (общая проверка)
    trigger: cashier_left
    checks: [{q: open_check}]
    timecode_offset: 0
    observed: "На {t} с кассир покидает рабочее место; без присмотра остаются: {items}."
    reason: "Ценности и рабочее место кассира оставлены без контроля."
    legal: safekeeping_general
